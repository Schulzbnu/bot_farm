[project]
name = "bot-farm"
version = "0.1.0"
description = "Bot autorizado para OTServer com navegação por radar"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless>=4.10.0.84",
  "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
bot-farm = "bot.cli:main"

[tool.setuptools]
packages = ["bot"]
